[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name: "aist" is taken on PyPI by an unrelated package; the import name stays `aist`.
name = "aist-thermo"
dynamic = ["version"]
description = "Free-energy contributions of ASE Atoms objects, and building blocks for (grand-)canonical ensembles of them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Andreu A. de Donato" },
]
keywords = [
  "ase",
  "thermodynamics",
  "grand canonical",
  "ab initio thermodynamics",
  "clusters",
  "nanoclusters",
  "statistical mechanics",
  "phase diagrams",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "ase>=3.22",
  "numpy>=1.22",
  "scipy>=1.8",
  "pymatgen>=2023.1.1",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/AndreudeDonato/aist"
Repository = "https://github.com/AndreudeDonato/aist"
Issues = "https://github.com/AndreudeDonato/aist/issues"

[tool.setuptools.packages.find]
include = ["aist", "aist.*"]

[tool.setuptools.dynamic]
version = { attr = "aist.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
